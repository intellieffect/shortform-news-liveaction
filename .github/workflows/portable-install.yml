# 고객이 받는 그대로가 Windows에서도 서는지 본다.
# 개발자 컴퓨터에서만 되는 것이 다시 들어오면 여기서 걸린다.
name: portable-install

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg 설치
        uses: FedericoCarboni/setup-ffmpeg@v3
      - run: npm ci
      - name: 스크립트 문법 확인
        run: python -m compileall -q plugin/skills/shortform-news-input/scripts
      - run: npm run lint
      - run: npm run zip:test
      - run: npm run videos:test
      - name: 환경 점검이 키 누락을 이름으로 알린다
        run: node scripts/produce.mjs doctor
